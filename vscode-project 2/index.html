<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>Infinite Pumpkin Opening</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage-shell">
      <div class="film-frame" id="filmFrame">
        <canvas id="artboard" width="1920" height="1080" aria-label="无文字实验艺术动画画布"></canvas>
        <audio id="soundtrack" src="./assets/background-soundtrack.mp3" preload="auto" loop hidden aria-hidden="true"></audio>
        <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
        <section id="entryScreen" class="entry-screen" aria-label="进入作品浏览" hidden>
          <div class="entry-background" aria-hidden="true"></div>
          <p class="entry-title">一个圆点，三种入口</p>
          <div class="entry-constellation" role="group" aria-label="直接进入作品空间">
            <button class="entry-seed seed-pumpkin" type="button" data-artwork="0" aria-label="直接进入南瓜作品空间">
              <span class="seed-art"><span class="artwork-motif motif-pumpkin" aria-hidden="true"></span></span>
              <span class="seed-label">南瓜</span>
            </button>
            <button class="entry-seed seed-infinity" type="button" data-artwork="1" aria-label="直接进入无限镜屋作品空间">
              <span class="seed-art"><span class="artwork-motif motif-infinity" aria-hidden="true"></span></span>
              <span class="seed-label">无限镜屋</span>
            </button>
            <button class="entry-seed seed-narcissus" type="button" data-artwork="2" aria-label="直接进入自恋庭园作品空间">
              <span class="seed-art"><span class="artwork-motif motif-narcissus" aria-hidden="true"></span></span>
              <span class="seed-label">自恋庭园</span>
            </button>
          </div>
          <button id="enterButton" class="entry-dot" type="button" aria-label="点击中央圆点，进入作品宇宙">
            <span class="entry-ring" aria-hidden="true"></span>
          </button>
          <p class="entry-instruction">轻触中央圆点，进入总览</p>
          <p class="entry-drag-hint">也可直接选择周围作品 · 拖动圆点星群</p>
          <div class="entry-satellites" aria-hidden="true"><i></i><i></i><i></i></div>
        </section>
        <div id="transitionBloom" class="transition-bloom" aria-hidden="true"></div>
        <section id="galleryScreen" class="gallery-screen" aria-label="作品浏览" hidden>
          <div class="gallery-background" aria-hidden="true"></div>
          <div class="depth-corridor" aria-hidden="true">
            <i class="depth-arch arch-near"></i><i class="depth-arch arch-middle"></i><i class="depth-arch arch-far"></i><i class="depth-arch arch-end"></i>
            <i class="depth-floor"></i>
          </div>
          <div class="gallery-field" aria-hidden="true"></div>
          <header class="gallery-heading">
            <span class="gallery-kicker">无限作品宇宙</span>
            <h1>从一个圆点，进入更多世界</h1>
            <p>移动鼠标或拖动空间探索，点击任意入口</p>
          </header>
          <button id="restartFromGallery" class="gallery-restart" type="button">重看开场 ↺</button>
          <div class="gallery-worlds" role="group" aria-label="自由选择作品空间">
            <button class="world-choice world-pumpkin" type="button" data-artwork="0" aria-label="进入南瓜作品空间">
              <span class="world-art"><span class="artwork-motif motif-pumpkin" aria-hidden="true"></span></span>
              <span class="world-index">01 · 圆点与南瓜</span>
              <strong>南瓜</strong>
              <span class="world-instruction">轻触进入 <span aria-hidden="true">↗</span></span>
            </button>
            <button class="world-choice world-infinity" type="button" data-artwork="1" aria-label="进入无限镜屋作品空间">
              <span class="world-art"><span class="artwork-motif motif-infinity" aria-hidden="true"></span></span>
              <span class="world-index">02 · 重复与无限</span>
              <strong>无限镜屋</strong>
              <span class="world-instruction">轻触进入 <span aria-hidden="true">↗</span></span>
            </button>
            <button class="world-choice world-narcissus" type="button" data-artwork="2" aria-label="进入自恋庭园作品空间">
              <span class="world-art"><span class="artwork-motif motif-narcissus" aria-hidden="true"></span></span>
              <span class="world-index">03 · 反射与增殖</span>
              <strong>自恋庭园</strong>
              <span class="world-instruction">轻触进入 <span aria-hidden="true">↗</span></span>
            </button>
          </div>
        </section>
        <section id="detailScreen" class="detail-screen" aria-label="作品简介" hidden>
          <div class="room-background" aria-hidden="true"></div>
          <canvas id="panoramaCanvas" class="panorama-canvas" width="960" height="540" aria-hidden="true"></canvas>
          <div class="detail-corridor" aria-hidden="true">
            <i class="room-arch room-near"></i><i class="room-arch room-middle"></i><i class="room-arch room-far"></i><i class="room-floor"></i>
          </div>
          <div class="scene-props scene-pumpkin" aria-hidden="true">
            <i class="pumpkin-globe pumpkin-one"></i><i class="pumpkin-globe pumpkin-two"></i><i class="pumpkin-globe pumpkin-three"></i>
          </div>
          <div class="scene-props scene-infinity" aria-hidden="true">
            <i class="mirror-depth mirror-one"></i><i class="mirror-depth mirror-two"></i><i class="mirror-depth mirror-three"></i><i class="mirror-depth mirror-four"></i>
          </div>
          <div class="scene-props scene-narcissus" aria-hidden="true">
            <i class="mirror-orb orb-one"></i><i class="mirror-orb orb-two"></i><i class="mirror-orb orb-three"></i><i class="mirror-orb orb-four"></i><i class="mirror-orb orb-five"></i>
          </div>
          <button id="backButton" class="back-dot" type="button" aria-label="返回作品浏览"><span aria-hidden="true">‹</span></button>
          <button id="immersiveButton" class="immersive-button" type="button" aria-pressed="false">沉浸探索空间 ↗</button>
          <span class="detail-kicker">作品档案</span>
          <div id="detailMotif" class="detail-motif motif-pumpkin" aria-hidden="true"></div>
          <div class="detail-information">
            <span id="detailNumber" class="detail-number">01 / 03</span>
            <h2 id="detailTitle">南瓜</h2>
            <p id="detailMeta" class="detail-meta">Pumpkin · 2016</p>
            <p id="detailDescription" class="detail-description"></p>
            <a id="sourceLink" class="source-link" href="https://www.si.edu/object/hmsg_2020.002" target="_blank" rel="noopener noreferrer">查看馆方作品资料 <span aria-hidden="true">↗</span></a>
            <p class="detail-hint">左右滑动 / 鼠标拖拽 / ← → 切换作品</p>
          </div>
          <div class="room-navigation" role="group" aria-label="切换作品空间">
            <button class="room-choice" type="button" data-room="0" aria-label="进入南瓜空间"><i class="motif-pumpkin"></i><span>南瓜</span></button>
            <button class="room-choice" type="button" data-room="1" aria-label="进入无限镜屋空间"><i class="motif-infinity"></i><span>镜屋</span></button>
            <button class="room-choice" type="button" data-room="2" aria-label="进入自恋庭园空间"><i class="motif-narcissus"></i><span>庭园</span></button>
          </div>
          <div class="panorama-hud" aria-label="全景视角控制">
            <span class="panorama-eyebrow">360° 全景探索</span>
            <span id="panoramaCompass" class="panorama-compass">方位 0°</span>
            <span id="panoramaZoom" class="panorama-zoom">缩放 100%</span>
            <div class="panorama-zoom-controls">
              <button id="zoomOutButton" type="button" aria-label="缩小视角">−</button>
              <button id="zoomInButton" type="button" aria-label="放大视角">+</button>
            </div>
          </div>
          <p class="immersive-hint">按住拖动，360°环视 · 滚轮或双指缩放 · 下方切换空间</p>
        </section>
      </div>
      <nav class="controls" aria-label="动画控制">
        <button id="replayButton" class="control replay" type="button" aria-label="重新播放"></button>
        <button id="playButton" class="control play is-playing" type="button" aria-label="暂停或播放"></button>
        <button id="recordButton" class="control record" type="button" aria-label="录制九秒动画"></button>
        <button id="fullscreenButton" class="control fullscreen" type="button" aria-label="全屏预览"></button>
      </nav>
    </main>
    <script src="./animation.js"></script>
  </body>
</html>
